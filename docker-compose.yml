version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zerocopy
      POSTGRES_USER: zerocopy
      POSTGRES_PASSWORD: zerocopy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/zerocopy123
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    volumes:
      - neo4j_data:/data

  backend:
    build: ./backend
    depends_on:
      - postgres
      - neo4j
    environment:
      DATABASE_URL: postgresql+psycopg2://zerocopy:zerocopy@postgres:5432/zerocopy
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: zerocopy123
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  neo4j_data:
